name: Pac-Man contribution graph

on:
  schedule:
    - cron: "30 5 * * *"   # daily, 05:30 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/arcade.yml"]

permissions:
  contents: write   # push the SVGs to the output branch

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a # main, 2026-11
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@fbf0a4fa4e00f45accd6cf3232368436ec06ed59 # v4.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
