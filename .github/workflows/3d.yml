name: 3D contribution calendar

on:
  schedule:
    - cron: "0 4 * * *"    # daily, 04:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/3d.yml"]

permissions:
  contents: write   # commit profile-3d-contrib/

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore: refresh 3D calendar [skip ci]"; then
            git pull --rebase --quiet && git push
          fi
