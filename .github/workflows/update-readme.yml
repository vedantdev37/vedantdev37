name: Update README

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}       # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:
      - "generate.py"
      - "scripts/requirements.txt"
      - "profile.jpg"
      - ".github/workflows/update-readme.yml"

# Required so the workflow can push the regenerated files back to the repo.
permissions:
  contents: write

# Avoid overlapping runs racing to push.
concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build profile card (portrait is cached; stats are live)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets
            git commit -m "chore: refresh profile card [skip ci]"
            git pull --rebase --quiet && git push
          else
            echo "No changes to commit."
          fi
